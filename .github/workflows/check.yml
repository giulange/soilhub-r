# R CMD check matrix (design 7.4). No job needs a secret.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

name: R-CMD-check

permissions: read-all

jobs:
  check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.name }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {name: check-release, os: ubuntu-latest,  r: release}
          - {name: check-oldest,  os: ubuntu-latest,  r: '4.1'}
          - {name: check-nosf,    os: ubuntu-latest,  r: release, nosf: true}
          - {name: check-mac,     os: macos-latest,   r: release}
          - {name: check-win,     os: windows-latest, r: release}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # New-submission / dev-version / unpublished-site notes of the CRAN
      # incoming check do not apply to a GitHub-only package.
      _R_CHECK_CRAN_INCOMING_: false
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: ${{ !matrix.config.nosf }}
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # check-nosf: install the package dependencies and the test tools but
      # not sf, so reads and exports without geometry are exercised alone.
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: ${{ matrix.config.nosf }}
        with:
          dependencies: '"hard"'
          extra-packages: any::rcmdcheck, any::testthat, any::webfakes
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'
          upload-snapshots: true
        env:
          _R_CHECK_FORCE_SUGGESTS_: ${{ matrix.config.nosf && 'false' || 'true' }}
