url: https://giulange.github.io/soilhub-r

destination: site

template:
  bootstrap: 5

# Reference groups (design 8): one per roxygen @family.
reference:
  - title: Session and identity
    contents:
      - soil_connect
      - soil_login
      - soil_logout
      - soil_session
      - soil_whoami
  - title: Discovery and catalog
    contents:
      - soil_capabilities
      - soil_api_info
      - soil_datasets
      - soil_dataset
      - soil_citations
      - soil_formats
      - soil_variables
      - soil_variable_mappings
      - soil_countries
      - soil_country
      - soil_code_lists
      - soil_code_list
      - soil_ttr_flag_legend
  - title: Reads
    contents:
      - soil_observations
      - soil_features
  - title: Summaries
    contents:
      - soil_summary
      - soil_availability
      - soil_consistency
  - title: Thematic reads
    desc: >
      Published derived values, soil-health scores, the resolution of source
      identities to canonical ids and the SOTWIS taxotransfer flags.
    contents:
      - soil_values
      - soil_values_summary
      - soil_health_scores
      - soil_health_summary
      - soil_resolve_targets
      - soil_ttr_flags
  - title: Exports
    desc: >
      Whole selections as files (GeoPackage, GeoJSON, CSV, TSV, Shapefile),
      followed, downloaded and read back as typed tables.
    contents:
      - soil_export
      - soil_export_status
      - soil_export_read
      - soil_export_from_error
  - title: Results
    contents:
      - soil_table
      - soil_metadata
      - soil_columns
      - soil_flags
      - soil_markings
      - soil_revised_rules
      - soil_first_layer
  - title: Writing data
    desc: >
      Variables, products, versions and runs, publication of derived values
      and soil-health scores (rights `soil:publish`, `soil:admin`).
    contents:
      - soil_register_variable
      - soil_product
      - soil_product_version
      - soil_run_open
      - soil_publish_values
      - soil_publish_health
      - soil_publish_source
      - soil_source_validate
  - title: Jobs
    contents:
      - soil_job
      - soil_job_wait
      - soil_job_cancel
      - soil_refresh_countries
  - title: Configuration and errors
    contents:
      - soilhub-config
      - soilhub-errors
  - title: Terms
    desc: >
      The words of the hub and of its sources (feature, profile, component,
      horizon, observation, PRID, HONU, SUID, CLAF, first_layer_status, ...).
    contents:
      - soilhub-terms
      - soilhub-package

articles:
  - title: Reading soil data
    navbar: Reading soil data
    contents:
      - installation
      - soilhub
      - raw-vs-revised
      - first-layer
      - exports
      - how-to-cite
  - title: Publishing data
    navbar: Publishing data
    contents:
      - writing-data
  - title: Upgrading
    navbar: Upgrading
    contents:
      - migration-0.1

authors:
